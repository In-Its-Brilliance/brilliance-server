[package]
name = "brilliance-server"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []

trace = []

deadlock_detection = ["parking_lot/deadlock_detection"]

[dependencies]
common = { git = "https://github.com/In-Its-Brilliance/brilliance-common", features = ["wasm-plugin", "full"] }
network = { git = "https://github.com/In-Its-Brilliance/brilliance-network" }
physics = { path = "../brilliance-physics" }

bevy = { version = "0.20", default-features = false }
bevy_app = "0.20"
bevy_ecs = "0.20"

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
env_logger = "0.11"
log = { version = "0.4" }
lazy_static = "1.5"
rustyline = { version = "19.0", features = ["with-file-history", "derive"] }
chrono = "0.4"
uuid = { version = "1.29", features = ["v4", "fast-rng"] }
fxhash = "0.2"
shellexpand = "3.1"
regex = "1.13"
tokio = { version = "1.54", features = [ "full" ] }
rand = "0.10"

zip = "9.1"

ahash = "0.8"
dashmap = "6.2"
parking_lot = "0.13"
flume = "0.12"

# Single thread links
send_wrapper = "0.6"

# ARGS
clap = { version = "4.6", features = ["string", "derive"] }

# Noise
bracket-lib = "0.8"
bracket-noise = "0.8"
bracket-random = "0.8"

# Schematics
flate2 = "1.1"
fastnbt = "2"

# Miltithread heavy tasks
rayon = "1.12"

postcard = { version = "1", features = ["alloc"] }

strum = "0.28"
strum_macros = "0.28"

extism = "1.41"
wasmtime = "49"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[patch."https://github.com/In-Its-Brilliance/brilliance-common"]
common = { path = "../brilliance-common" }

[patch."https://github.com/In-Its-Brilliance/brilliance-network"]
network = { path = "../brilliance-network" }
